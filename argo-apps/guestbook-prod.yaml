apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/akash63652/gitops-lab.git
    targetRevision: main
    path: apps/guestbook/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
