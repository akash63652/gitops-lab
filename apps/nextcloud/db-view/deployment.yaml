apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db-view
  namespace: nextcloud
  labels:
    app: nextcloud-db-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db-view
  template:
    metadata:
      labels:
        app: nextcloud-db-view
    spec:
      serviceAccountName: nextcloud
      containers:
        - name: adminer
          image: docker.io/library/adminer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: nextcloud-db
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
