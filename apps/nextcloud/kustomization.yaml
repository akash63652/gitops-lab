apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  # Shared / Base
  - serviceaccount.yaml
  - secrets.yaml
  # Nextcloud Core
  - nextcloud/pvc.yaml
  - nextcloud/deployment.yaml
  - nextcloud/service.yaml
  - nextcloud/route.yaml
  - nextcloud/cronjob.yaml
  # PostgreSQL
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  # Redis
  - redis/deployment.yaml
  - redis/service.yaml
  # Collabora
  - collabora/deployment.yaml
  - collabora/service.yaml
  - collabora/route.yaml
  # DB Viewer
  - db-view/deployment.yaml
  - db-view/service.yaml
  - db-view/route.yaml
