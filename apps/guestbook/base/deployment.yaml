apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  labels:
    app: guestbook-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - name: guestbook-ui
          image: quay.io/openshift/origin-hello-openshift:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "base"
